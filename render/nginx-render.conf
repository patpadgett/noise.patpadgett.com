# CUE render box — render.patpadgett.com → cue_render.py on 127.0.0.1:8790
# Install:  sudo cp render/nginx-render.conf /etc/nginx/sites-available/render.patpadgett.com
#           sudo ln -s /etc/nginx/sites-available/render.patpadgett.com /etc/nginx/sites-enabled/
#           sudo certbot --nginx -d render.patpadgett.com      (after the DNS A record exists)
# The site itself (GitHub Pages) is static: the browser calls this host directly, with the bearer token from SETUP.
# cue_render.py answers CORS for the noise.patpadgett.com origin; nginx just terminates TLS and passes through.
server {
    listen 80;
    server_name render.patpadgett.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name render.patpadgett.com;
    ssl_certificate /etc/letsencrypt/live/render.patpadgett.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/render.patpadgett.com/privkey.pem;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
